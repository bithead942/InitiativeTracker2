<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>D&D Initiative Tracker 2.0</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <div class="list" id="list"></div>
    <div class="toolbar">
      <button id="addBtn" class="toolbtn" title="Add">
        <img src="img/AddButton.jpg" alt="Add" class="toolbtn-img">
      </button>
      <button id="prevBtn" class="toolbtn" title="Prev Init">
        <img src="img/PrevButton.jpg" alt="Prev Init" class="toolbtn-img">
      </button>
      <button id="nextBtn" class="toolbtn" title="Next Init">
        <img src="img/NextButton.jpg" alt="Next Init" class="toolbtn-img">
      </button>
      <button id="sortBtn" class="toolbtn" title="Sort Init">
        <img src="img/SortButton.jpg" alt="Sort Init" class="toolbtn-img">
      </button>
      <button id="clearBtn" class="toolbtn" title="Clear">
        <img src="img/ClearButton.jpg" alt="Clear" class="toolbtn-img">
      </button>
      <label class="dm-toggle">
        <input type="checkbox" id="dmCheck">
        <span>DM</span>
      </label>
    </div>
  </div>
  <script src="renderer.js"></script>
</body>
</html>
