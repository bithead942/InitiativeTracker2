<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>D&D Initiative Tracker 2.0</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <div class="list" id="list"></div>
    <div class="toolbar">
      <button id="addBtn" class="toolbtn" title="Add">
        <svg viewBox="0 0 24 24" class="icon"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="3" fill="none"/></svg>
        <span>Add</span>
      </button>
      <button id="prevBtn" class="toolbtn" title="Prev Init">
        <svg viewBox="0 0 24 24" class="icon"><path d="M11 7l-6 5 6 5M18 7l-6 5 6 5" stroke="currentColor" stroke-width="2" fill="none"/></svg>
        <span>Prev Init</span>
      </button>
      <button id="nextBtn" class="toolbtn" title="Next Init">
        <svg viewBox="0 0 24 24" class="icon"><path d="M6 7l6 5-6 5M13 7l6 5-6 5" stroke="currentColor" stroke-width="2" fill="none"/></svg>
        <span>Next Init</span>
      </button>
      <button id="sortBtn" class="toolbtn" title="Sort Init">
        <svg viewBox="0 0 24 24" class="icon"><path d="M4 6h16M8 12h12M12 18h8" fill="none" stroke="currentColor" stroke-width="3"/><path d="M4 18l4-12" stroke="currentColor" stroke-width="2"/></svg>
        <span>Sort Init</span>
      </button>
      <button id="clearBtn" class="toolbtn" title="Clear">
        <svg viewBox="0 0 24 24" class="icon"><path d="M5 8h14M8 8v10a2 2 0 002 2h4a2 2 0 002-2V8M10 5h4" stroke="currentColor" stroke-width="2" fill="none"/></svg>
        <span>Clear</span>
      </button>
      <label class="dm-toggle">
        <input type="checkbox" id="dmCheck">
        <span>DM</span>
      </label>
    </div>
  </div>
  <script src="renderer.js"></script>
</body>
</html>
